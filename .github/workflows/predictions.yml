name: AFI predictions
on:
  schedule:
    - cron: '0 12 * * *' # 08:00 ET (UTC offset is adjusted seasonally by the workflow owner)
    - cron: '0 16 * * 0' # Sunday 11:00 ET
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish the refreshed predictions
        type: choice
        options: [both, staging, production]
        default: both
permissions:
  contents: read
concurrency:
  group: afi-predictions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r scripts/model/requirements.txt
      - run: python scripts/model/predict_upcoming.py
      - uses: actions/upload-artifact@v4
        with:
          name: afi-predictions
          path: scripts/model/predictions_current.json
      - name: Publish production predictions
        if: github.event_name == 'schedule' || inputs.target != 'staging'
        run: |
          test -n "$AFI_URL" && test -n "$AFI_ADMIN_TOKEN"
          curl --fail-with-body --connect-timeout 10 --max-time 60 --retry 2 -X POST "$AFI_URL/api/admin/predictions" -H "Authorization: Bearer $AFI_ADMIN_TOKEN" -H "Content-Type: application/json" --data-binary @scripts/model/predictions_current.json
        env:
          AFI_URL: ${{ secrets.AFI_URL }}
          AFI_ADMIN_TOKEN: ${{ secrets.AFI_ADMIN_TOKEN }}
      - name: Publish staging predictions
        if: github.event_name == 'schedule' || inputs.target != 'production'
        run: |
          test -n "$AFI_URL" && test -n "$AFI_ADMIN_TOKEN"
          curl --fail-with-body --connect-timeout 10 --max-time 60 --retry 2 -X POST "$AFI_URL/api/admin/predictions" -H "Authorization: Bearer $AFI_ADMIN_TOKEN" -H "Content-Type: application/json" --data-binary @scripts/model/predictions_current.json
        env:
          AFI_URL: ${{ secrets.STAGING_AFI_URL }}
          AFI_ADMIN_TOKEN: ${{ secrets.STAGING_AFI_ADMIN_TOKEN }}
