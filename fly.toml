app = "american-football-insider"
primary_region = "iad"

[env]
  PORT = "8080"
  DB_PATH = "/data/nfl-data.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "afi_data"
  destination = "/data"
