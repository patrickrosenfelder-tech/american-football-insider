app = 'american-football-insider'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/nfl-data.db'
  # 256 MB VM: cap the V8 heap so GC runs before the kernel OOM-kills the process.
  NODE_OPTIONS = '--max-old-space-size=120'

# Persistent SQLite (news summaries, injury snapshots, AFI pick record).
[mounts]
  source = 'afi_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
