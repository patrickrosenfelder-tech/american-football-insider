# Isolated PR #5 preview. Deploy explicitly with: fly deploy -c fly.pr5.toml
app = 'american-football-insider-pr5'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/preview.db'
  NODE_OPTIONS = '--max-old-space-size=256'
  SITE_URL = 'https://american-football-insider-pr5.fly.dev'
  PREVIEW_DEPLOYMENT = 'true'

[mounts]
  source = 'afi_preview_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
